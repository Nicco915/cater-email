[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cater"
version = "0.1.0"
description = "Local, mail-driven export document intake and delivery application"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
  "fastapi==0.140.0",
  "uvicorn==0.48.0",
  "jinja2==3.1.6",
  "python-multipart==0.0.29",
  "itsdangerous==2.2.0",
  # Business core conversion dependencies (core-owned imports).
  "openpyxl==3.1.5",
  "xlrd==2.0.2",          # 真正 BIFF .xls 只读解析（纯 Python，支持 Windows）
  "beautifulsoup4==4.15.0",
  "lxml==6.1.1",
  "et_xmlfile==2.0.0",
  "soupsieve==2.9.1",
  # Offline Outlook .msg parsing (no Outlook GUI automation).
  "extract-msg==0.58.1",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "httpx==0.28.1",
]

[project.scripts]
cater-app = "cater.app.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["cater.app*", "cater.core*"]
namespaces = true

[tool.setuptools.package-data]
"cater.app.web" = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"