<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}CATER 本地管理{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><a href="/">CATER 本地管理</a></div>
    <nav>
      <a href="/">任务</a>
      <a href="/logs">日志</a>
      <a href="/references">参考资料</a>
      <a href="/settings">设置</a>
      <a href="/health">健康</a>
      <a href="/diagnostics">诊断</a>
    </nav>
  </header>
  <main>
    {% if error %}<div class="flash error" role="alert">{{ error }}</div>{% endif %}
    {% if message %}<div class="flash success" role="status">{{ message }}</div>{% endif %}
    {% block content %}{% endblock %}
  </main>
  <footer>仅绑定本机回环地址 · 出厂默认 dry-run · {{ now }}</footer>
  <script src="/static/app.js"></script>
</body>
</html>
